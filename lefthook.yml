# Git hooks, installed automatically by `pnpm install` (the `prepare` script).
# Skip in an emergency with `LEFTHOOK=0 git commit ...`; CI runs the same checks anyway.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,tsx,mjs,cjs,json,jsonc,css}"
      run: pnpm biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    secrets:
      run: pnpm check-secrets

# Conventional Commits, rules in commitlint.config.js. CI checks PR titles with the same rules.
commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

# Sequential: typecheck rebuilds packages/*/dist, which type-aware ESLint reads.
pre-push:
  piped: true
  commands:
    typecheck:
      priority: 1
      run: pnpm typecheck
    eslint:
      priority: 2
      run: pnpm eslint
